<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compare Documents</title>
  <link rel="stylesheet" href="/src/taskpane/taskpane.css" />
  <link rel="stylesheet" href="/src/taskpane/settings.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>

<div class="header">
  <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings" data-hint="Settings">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M8.94 2.5h2.12l.38 1.9c.43.12.83.29 1.21.5l1.72-1 1.5 1.5-1 1.72c.21.38.38.78.5 1.21l1.9.38v2.12l-1.9.38c-.12.43-.29.83-.5 1.21l1 1.72-1.5 1.5-1.72-1c-.38.21-.78.38-1.21.5l-.38 1.9H8.94l-.38-1.9a5.95 5.95 0 0 1-1.21-.5l-1.72 1-1.5-1.5 1-1.72a5.95 5.95 0 0 1-.5-1.21l-1.9-.38V8.94l1.9-.38c.12-.43.29-.83.5-1.21l-1-1.72 1.5-1.5 1.72 1c.38-.21.78-.38 1.21-.5l.38-1.9zM10 7.25A2.75 2.75 0 1 0 10 12.75 2.75 2.75 0 0 0 10 7.25z"/>
    </svg>
  </button>
  <div class="brand-bar brand-compare">
    <div class="brand-text">Compare Server</div>
  </div>
  <p>Compare documents to Understand the differences between documents.</p>
</div>

<div class="content">

  <div class="compare-sections">
    <div class="section">
      <div class="section-label">Original</div>
      <div id="original-content">
        <div class="source-list">
          <button class="source-btn" data-action="current" data-section="original" type="button" data-hint="Use the current document">
            <img width="16" height="16" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23616161'%3E%3Cpath d='M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414c0-.53-.21-1.04-.586-1.414l-3.414-3.414A2 2 0 0010.586 2H6zm4.5 1.5V7a.5.5 0 00.5.5h3.5L10.5 3.5z'/%3E%3Cpath d='M10 14.5a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0zm-2.15-1.85a.5.5 0 0 0-.7 0L4.5 15.29l-.65-.64a.5.5 0 0 0-.7.7l1 1c.2.2.5.2.7 0l3-3a.5.5 0 0 0 0-.7z'/%3E%3C/svg%3E" alt="" />
            Current Document
          </button>
          <button class="source-btn" data-action="browse" data-section="original" type="button" data-hint="Choose a file from your device">
            <img width="16" height="16" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23616161'%3E%3Cpath d='M2 5.5A2.5 2.5 0 014.5 3h2.646c.398 0 .78.158 1.06.44l1.086 1.085c.14.14.332.22.53.225h5.678A2.5 2.5 0 0118 7.25v7.25A2.5 2.5 0 0115.5 17H4.5A2.5 2.5 0 012 14.5V5.5z'/%3E%3Cpath d='M13.85 11.15a.5.5 0 0 0-.7-.7l-2.65 2.65V7.5a.5.5 0 0 0-1 0v5.6l-2.65-2.65a.5.5 0 0 0-.7.7l3.5 3.5a.5.5 0 0 0 .7 0l3.5-3.5z'/%3E%3C/svg%3E" alt="" />
            Local device
          </button>
        </div>
      </div>
      <input id="file-input-original" type="file" accept=".doc,.docx,.rtf,.txt,.pdf" style="display:none" />
    </div>

    <hr class="section-divider" />

    <div class="section">
      <div class="section-label">Modified</div>
      <div id="modified-content">
        <div class="source-list">
          <button class="source-btn" data-action="current" data-section="modified" type="button" data-hint="Use the current document">
            <img width="16" height="16" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23616161'%3E%3Cpath d='M6 2a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V7.414c0-.53-.21-1.04-.586-1.414l-3.414-3.414A2 2 0 0010.586 2H6zm4.5 1.5V7a.5.5 0 00.5.5h3.5L10.5 3.5z'/%3E%3Cpath d='M10 14.5a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0zm-2.15-1.85a.5.5 0 0 0-.7 0L4.5 15.29l-.65-.64a.5.5 0 0 0-.7.7l1 1c.2.2.5.2.7 0l3-3a.5.5 0 0 0 0-.7z'/%3E%3C/svg%3E" alt="" />
            Current Document
          </button>
          <button class="source-btn" data-action="browse" data-section="modified" type="button" data-hint="Choose a file from your device">
            <img width="16" height="16" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%23616161'%3E%3Cpath d='M2 5.5A2.5 2.5 0 014.5 3h2.646c.398 0 .78.158 1.06.44l1.086 1.085c.14.14.332.22.53.225h5.678A2.5 2.5 0 0118 7.25v7.25A2.5 2.5 0 0115.5 17H4.5A2.5 2.5 0 012 14.5V5.5z'/%3E%3Cpath d='M13.85 11.15a.5.5 0 0 0-.7-.7l-2.65 2.65V7.5a.5.5 0 0 0-1 0v5.6l-2.65-2.65a.5.5 0 0 0-.7.7l3.5 3.5a.5.5 0 0 0 .7 0l3.5-3.5z'/%3E%3C/svg%3E" alt="" />
            Local device
          </button>
        </div>
      </div>
      <input id="file-input-modified" type="file" accept=".doc,.docx,.rtf,.txt,.pdf" style="display:none" />
    </div>

    <div class="swap-rail">
      <button id="btn-swap-files" class="swap-btn" type="button" aria-label="Swap selected documents" data-hint="Swap Original and Modified files">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 2l3 3h-2v6H9V5H7l3-3zm0 16l-3-3h2V9h2v6h2l-3 3z"/>
        </svg>
      </button>
    </div>
  </div>

  <hr class="section-divider-outer" />

  <div>
    <button id="btn-compare" class="btn-compare" type="button" disabled data-hint="Compare the selected documents">Compare</button>
    <button id="btn-cancel-compare" class="btn-action btn-cancel-compare" type="button" style="display:none" data-hint="Cancel the comparison request">Cancel</button>

    <div id="result-actions" class="result-actions" style="display:none">
      <button id="btn-view" class="btn-action" type="button" data-hint="Open the comparison in a browser">View</button>
      
      <div class="split-btn-group dd-wrap">
        <button id="btn-save-primary" class="btn-action split-btn-main" type="button" data-hint="Save file">Save</button>
        <button id="btn-save-toggle" class="btn-action split-btn-toggle" type="button" aria-label="More save options" data-hint="Choose a save format">▾</button>
        
        <div id="dd-menu" class="dd-menu">
          <button class="dd-item" data-format="pdf" type="button">PDF</button>
          <button class="dd-item" data-format="track_changes" type="button">Track Changes</button>
          <button class="dd-item" data-format="docx" type="button">Docx</button>
          <button class="dd-item" data-format="changedPagesPdf" type="button">Redline Pages</button>
        </div>
      </div>

      <div class="split-btn-group dd-wrap">
        <button id="btn-email-primary" class="btn-action split-btn-main" type="button" data-hint="Email selected files">Email</button>
        <button id="btn-email-toggle" class="btn-action split-btn-toggle" type="button" aria-label="More email options" data-hint="Choose email attachments">▾</button>
        
        <div id="email-menu" class="dd-menu checkbox-menu">
          <label class="dd-item" data-option="original"><input type="checkbox" value="original" /> Original file</label>
          <label class="dd-item" data-option="modified"><input type="checkbox" value="modified" /> Modified file</label>
          <hr style="margin: 4px 0; border: none; border-top: 1px solid #e0e0e0;">
          <label class="dd-item" data-option="pdf"><input type="checkbox" value="pdf" checked /> Redline (PDF)</label>
          <label class="dd-item" data-option="docx"><input type="checkbox" value="docx" /> Redline (Docx)</label>
          <label class="dd-item" data-option="track_changes"><input type="checkbox" value="track_changes" /> Track Changes</label>
          <label class="dd-item" data-option="changedPagesPdf"><input type="checkbox" value="changedPagesPdf" /> Redline Pages</label>
        </div>
      </div>

      <button id="btn-reset" class="btn-action" type="button" data-hint="Clear selected documents">Reset</button>
    </div>

    <div id="status-wrap"></div>
  </div>

</div>

<div id="settings-mount"></div>

<script src="/src/taskpane/settings.js"></script>
<script src="/src/taskpane/taskpane.js"></script>
</body>
</html>
