<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Litera Compare - Upload Documents</title>
  <link rel="stylesheet" href="/CustomerViewer/home.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 id="page-title">Select the documents to compare:</h1>
    </div>
  </header>

  <main class="home-shell">
    <section class="hero-card" aria-labelledby="page-title">
      <form id="compare-form" class="compare-form" novalidate>
        <div class="upload-grid">
          <section class="upload-tile" aria-labelledby="original-title">
            <div class="tile-icon" aria-hidden="true">O</div>
            <div class="tile-copy">
              <h2 id="original-title">Original</h2>
              <p>Choose the baseline document.</p>
            </div>
            <label class="file-picker" for="file-original">
              <span>Browse file</span>
              <input
                id="file-original"
                name="file1"
                type="file"
                accept=".doc,.docx,.rtf,.txt,.pdf"
              >
            </label>
            <p id="file-original-name" class="file-name" aria-live="polite">No file selected</p>
          </section>

          <div class="swap-column">
            <button
              id="swap-button"
              type="button"
              class="swap-button"
              aria-label="Swap original and modified documents"
              title="Swap selected documents"
            >
              <span class="swap-button__icon" aria-hidden="true">&#8646;</span>
            </button>
          </div>

          <section class="upload-tile" aria-labelledby="modified-title">
            <div class="tile-icon tile-icon-alt" aria-hidden="true">M</div>
            <div class="tile-copy">
              <h2 id="modified-title">Modified</h2>
              <p>Choose the updated document.</p>
            </div>
            <label class="file-picker" for="file-modified">
              <span>Browse file</span>
              <input
                id="file-modified"
                name="file2"
                type="file"
                accept=".doc,.docx,.rtf,.txt,.pdf"
              >
            </label>
            <p id="file-modified-name" class="file-name" aria-live="polite">No file selected</p>
          </section>
        </div>

        <div class="action-row">
          <button id="submit-button" type="submit" class="btn btn-primary" disabled>View Changes</button>
          <button id="reset-button" type="button" class="btn btn-secondary">Reset</button>
        </div>

        <div id="status-area" class="status-panel" role="status" aria-live="polite">
          Choose an original and a modified document to continue.
        </div>
      </form>
    </section>
  </main>

  <script src="/CustomerViewer/home.js"></script>
</body>
</html>
