<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Litera DeltaView</title>
  <link rel="stylesheet" href="viewer.css">
  <style>
    /* Top Right Header Controls for DeltaView */
    #viewer-controls-bar {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewer-control-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      color: #111827;
      font-family: sans-serif;
      font-size: 14px;
      box-sizing: border-box;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    /* SSO User Badge */
    #dv-user-badge {
      padding: 0 10px 0 4px;
      gap: 6px;
      cursor: default;
    }
    .dv-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #2563eb;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dv-username {
      font-weight: 500;
      white-space: nowrap;
    }

    /* Language Selector */
    #viewer-lang-selector {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      padding: 0 24px 0 10px;
      height: 100%;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }
    .lang-selector-wrapper {
      position: relative;
      padding: 0;
    }
    .lang-selector-wrapper::after {
      content: '';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 5px;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23111827' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-size: contain;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    /* Logout Button */
    #dv-btn-logout {
      width: 32px;
      padding: 0;
      cursor: pointer;
      transition: background 0.15s;
    }
    #dv-btn-logout:hover {
      background: #f3f4f6;
    }
    #dv-btn-logout svg {
      width: 16px;
      height: 16px;
      stroke: #111827;
      stroke-width: 1.5;
    }
  </style>
</head>
<body>
  <div id="error-container" style="display: none; padding: 20px; color: red; text-align: center;"></div>
  
    <div id="viewer-controls-bar" style="position: fixed; top: 10px; right: 12px; z-index: 9999; display: flex; align-items: center; gap: 8px;">
        
        <!-- Language Selector -->
        <div style="position: relative; height: 32px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: #1e3a8a; box-shadow:0 1px 3px rgba(30,58,138,0.3);">
          <select id="viewer-lang-selector" style="appearance: none; -webkit-appearance: none; border: none; background: transparent; padding: 0 32px 0 12px; height: 100%; font-family: sans-serif; font-size: 13px; font-weight: 500; color: #ffffff; cursor: pointer; outline: none;">
          </select>
          <div style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 10px; height: 6px; background-image: url(&quot;data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E&quot;); background-size: contain; background-repeat: no-repeat; pointer-events: none;"></div>
        </div>
      
      <!-- User Badge -->
      <div id="dv-user-badge" class="viewer-control-btn" style="display: none; height: 36px; width: 36px; border: 1px solid #d1d5db; border-radius: 50%; background: #ffffff; align-items: center; padding: 0; justify-content: center; cursor: default;">
        <div class="dv-avatar" id="dv-avatar-initials" style="width: 24px; height: 24px; border-radius: 50%; background: transparent; color: #1e3a8a; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center;"></div>
      </div>

      <!-- Logout Button -->
      <button id="dv-btn-logout" class="viewer-control-btn" style="display: none; height: 36px; width: 36px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; align-items: center; justify-content: center; padding: 0; cursor: pointer;" title="Sign Out">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 20px; height: 20px;">
          <path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M17.25 15l3-3m0 0l-3-3m3 3H9" stroke="#111827" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
    </div>
    <div id="deltaview-container" style="width: 100vw; height: 100vh;"></div>

  <script src="i18n.js"></script>
  <!-- deltaview.js will be dynamically injected by viewer.js based on server config -->
  <script src="viewer.js"></script>
</body>
</html>
